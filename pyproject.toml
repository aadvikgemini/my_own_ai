[project]
name = "mini-ai-assistant"
version = "1.0.0"
description = "Secure Mini AI Assistant powered by FastAPI and OpenAI Responses API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "openai>=1.60.0,<3.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[tool.vercel]
entrypoint = "backend.main:app"
